name: dev045-d6r26a-p2-r27p5-compiled-rolling-feature-kernel-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p4-compiled-dual-book-state-kernel-preexecution
  workflow_dispatch:

jobs:
  r27p5-compiled-rolling-feature-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install narrow synthetic test surface
        run: |
          python -m pip install -U pip
          python -m pip install pytest numpy==2.2.6 pyarrow==25.0.1 numba==0.67.0 llvmlite==0.49.0
          python -m pip install -e . --no-deps
      - name: Run R27P5 compiled rolling feature parity tests
        run: |
          python -m pytest -q tests/test_dev045_d6r26a_p2_r27p5_compiled_rolling_feature_kernel_preexecution.py
      - name: Prove R27P5 remains historical-closed and pre-attempt
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r27p5_compiled_rolling_feature_kernel_preexecution as r
          r.validate_r27p5_contract()
          assert r.P2_ATTEMPT_CONSUMED is False
          assert r.REAL_HISTORICAL_BENCHMARK_AUTHORIZED is False
          assert r.FULL_JAN_JUL_RERUN_AUTHORIZED is False
          assert r.SIMULATOR_LANE_AUTHORIZED is False
          assert r.MODEL_FIT_AUTHORIZED is False
          assert r.PNL_AUTHORIZED is False
          print('R27P5_COMPILED_ROLLING_FEATURE_KERNEL=PASS')
          print('HISTORICAL_SOURCE_OPENED=NO')
          print('P2_ATTEMPT_CONSUMED=NO')
          print('FULL_JAN_JUL_RERUN=NO')
          print('SIMULATOR_RUN=NO')
          print('MODEL_FIT=NO')
          print('PNL=NO')
          PY

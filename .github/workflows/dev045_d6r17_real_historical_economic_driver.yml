name: dev045-d6r17-real-historical-economic-driver

on:
  push:
    branches:
      - research/dev045-m6-d6r17-post-ingestion-advancement-design
  workflow_dispatch:

jobs:
  dev045-d6r17-real-historical-economic-driver:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install -U pip
          python -m pip install pytest maturin polars

      - name: Checkout exact upstream hftbacktest 2.4.4
        run: |
          git clone \
            https://github.com/nkaz001/hftbacktest.git \
            /tmp/hftbacktest

          git -C /tmp/hftbacktest \
            checkout --detach \
            a244a14250b42d97fc305569c93c4117cd5e1dff

          test \
            "$(git -C /tmp/hftbacktest rev-parse HEAD)" = \
            "a244a14250b42d97fc305569c93c4117cd5e1dff"

      - name: Apply frozen DEV045 patch
        run: |
          python tools/patch_hftbacktest_244_safe.py \
            /tmp/hftbacktest

      - name: Build exact patched simulator
        run: |
          python -m pip install \
            /tmp/hftbacktest/py-hftbacktest

      - name: Install project
        run: |
          python -m pip install -e .

      - name: Verify simulator identity
        run: |
          python - <<'PY'
          import hftbacktest

          assert hftbacktest.__version__ == "2.4.4"

          print("HFTBACKTEST_VERSION=2.4.4")
          print("PATCHED_KERNEL_REQUIRED=YES")
          PY

      - name: Run D6R17 implementation tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r17_real_historical_economic_driver.py \
            tests/test_dev045_d6r17_real_historical_economic_driver_contract.py \
            tests/test_dev045_m6_event_loop_kernel.py \
            tests/test_dev045_m6_policy_integration.py

      - name: Verify canonical surfaces remain closed
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r17_real_historical_economic_driver as d,
          )

          assert d.CANONICAL_SOURCE_OPEN_IMPLEMENTED is False
          assert (
              d.CANONICAL_EXECUTION_AUTHORIZED_BY_DEFAULT
              is False
          )
          assert d.AUTOMATIC_RETRY is False
          assert d.CANONICAL_PNL_WRITE_ENABLED is False
          assert d.NETWORK_ACQUISITION_ENABLED is False
          assert d.LIVE_TRADING_AUTHORIZED is False

          print("CANONICAL_SOURCE_OPEN=NO")
          print("CANONICAL_EXECUTION=NO")
          print("CANONICAL_PNL=NO")
          print("LIVE_TRADING=NO")
          PY

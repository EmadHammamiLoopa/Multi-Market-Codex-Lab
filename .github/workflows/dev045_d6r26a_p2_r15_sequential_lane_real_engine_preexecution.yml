name: dev045-d6r26a-p2-r15-sequential-lane-real-engine-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r15-sequential-lane-real-engine-preexecution
    paths:
      - src/multimarket/dev045_d6r26a_p2_r15_sequential_lane_real_engine_preexecution.py
      - tests/test_dev045_d6r26a_p2_r15_sequential_lane_real_engine_preexecution.py
      - docs/dev045_d6r26a_p2_r15_sequential_lane_real_engine_preexecution.md
      - .github/workflows/dev045_d6r26a_p2_r15_sequential_lane_real_engine_preexecution.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r15-real-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install narrow test surface
        run: |
          python -m pip install -U pip pytest numpy

      - name: Restore exact patched hftbacktest wheel
        id: hft-wheel-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install maturin on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install maturin

      - name: Build exact patched simulator wheel on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nkaz001/hftbacktest.git /tmp/hftbacktest
          git -C /tmp/hftbacktest checkout --detach a244a14250b42d97fc305569c93c4117cd5e1dff

          test "$(git -C /tmp/hftbacktest rev-parse HEAD)" = \
            "a244a14250b42d97fc305569c93c4117cd5e1dff"

          python tools/patch_hftbacktest_244_safe.py /tmp/hftbacktest

          mkdir -p /tmp/dev045-hft244-wheel

          python -m pip wheel \
            --no-deps \
            --wheel-dir /tmp/dev045-hft244-wheel \
            /tmp/hftbacktest/py-hftbacktest

          test "$(
            find /tmp/dev045-hft244-wheel \
              -maxdepth 1 \
              -type f \
              -name 'hftbacktest-2.4.4-*.whl' |
            wc -l
          )" = "1"

      - name: Save exact patched wheel immediately after build
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install exact patched simulator and project
        run: |
          WHEEL="$(
            find /tmp/dev045-hft244-wheel \
              -maxdepth 1 \
              -type f \
              -name 'hftbacktest-2.4.4-*.whl' \
              -print \
              -quit
          )"

          test -n "$WHEEL"

          python -m pip install "$WHEEL"
          python -m pip install -e . --no-deps

      - name: Verify exact engine identity
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r5_real_engine_binding_prehistorical as r5,
          )

          identity = r5.verify_engine_identity()
          assert identity.version == "2.4.4"

          print("HFTBACKTEST_244_IDENTITY=PASS")
          PY

      - name: Run R15 sequential same-engine probes
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p2_r15_sequential_lane_real_engine_preexecution.py

      - name: Prove previous-failure guards and historical seal
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r15_sequential_lane_real_engine_preexecution as r15,
          )

          r15.validate_r15_contract()

          assert r15.FIXED_EVENT_TARGET is None
          assert r15.FIXED_WAKEUP_TARGET is None
          assert r15.TOTAL_RSS_ABORT_THRESHOLD_BYTES is None
          assert r15.TOTAL_RSS_IS_BOUNDEDNESS_GATE is False

          assert (
              r15.END_OF_SOURCE_CANDIDATES_RETAINED_WITH_CENSORING
              is True
          )
          assert r15.CENSORED_MAPS_TO_NO_FILL is False

          assert r15.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r15.CANONICAL_HISTORICAL_RUN_AUTHORIZED is False
          assert r15.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r15.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r15.MODEL_FIT_AUTHORIZED is False
          assert r15.PNL_AUTHORIZED is False

          print("R15_SEQUENTIAL_SAME_ENGINE=PASS")
          print("DECISIONS_NS=31000000000,36000000000,41000000000")
          print("CANDIDATES_PER_SYNTHETIC_LANE=3")
          print("PREVIOUS_TERMINAL_BEFORE_NEXT_PLACEMENT=YES")
          print("EQUAL_TIMESTAMP_TERMINAL_THEN_PLACEMENT=YES")
          print("EOF_CANDIDATE_RETENTION=YES")
          print("EOF_UNOBSERVED_HORIZON=CENSORED")
          print("FIXED_EVENT_TARGET=NONE")
          print("FIXED_WAKEUP_TARGET=NONE")
          print("TOTAL_RSS_ABORT_GATE=NONE")
          print("HISTORICAL_SOURCE_OPEN=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

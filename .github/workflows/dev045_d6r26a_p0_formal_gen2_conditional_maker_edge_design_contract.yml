name: dev045-d6r26a-p0-formal-gen2-conditional-maker-edge-design-contract

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p0-formal-gen2-conditional-maker-edge-design
    paths:
      - src/multimarket/dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.py
      - docs/dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.md
      - tests/test_dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.py
      - .github/workflows/dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design_contract.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.py
      - docs/dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.md
      - tests/test_dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.py
      - .github/workflows/dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design_contract.yml

jobs:
  d6r26a-p0-design-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and pytest
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest

      - name: Run D6R26A P0 contract tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.py

      - name: Prove P0 design remains closed
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design as d

          d.validate_design_contract()
          assert d.P0_DESIGN_ONLY is True
          assert d.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert d.CANDIDATE_SIMULATION_AUTHORIZED is False
          assert d.MODEL_FIT_AUTHORIZED is False
          assert d.PNL_AUTHORIZED is False
          assert d.ECONOMIC_ARENA_AUTHORIZED is False
          assert d.FEE_RESCUE_AUTHORIZED is False
          assert d.SIZE_TUNING_AUTHORIZED is False
          assert d.LEVERAGE_AUTHORIZED is False
          assert d.LIVE_TRADING_AUTHORIZED is False
          assert d.AUG_OPEN_AUTHORIZED is False
          assert d.SEP_PLUS_OPEN_AUTHORIZED is False
          assert d.NON_BTC_OPEN_AUTHORIZED is False
          assert d.CENSORED_MAPS_TO_NO_FILL is False
          assert d.SPREAD_CAPTURE_ADDED_SEPARATELY is False
          assert d.CROSS_VENUE_FEATURES_IN_A0 is False
          print("D6R26A_P0_DESIGN_ONLY=YES")
          print("HISTORICAL_SOURCE_OPENED=NO")
          print("CANDIDATE_SIMULATION=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          print("ECONOMIC_ARENA=NO")
          print("LIVE_TRADING=NO")
          PY

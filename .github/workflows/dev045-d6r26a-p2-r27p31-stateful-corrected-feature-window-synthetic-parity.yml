name: dev045-d6r26a-p2-r27p31-stateful-corrected-feature-window-synthetic-parity

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p31-stateful-corrected-feature-window-synthetic-parity

jobs:
  r27p31-stateful-corrected-feature-window-synthetic-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install narrow synthetic parity surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy pyarrow numba llvmlite
      - name: Run single-pass R27P31 parity and closure tests
        run: pytest -q tests/test_dev045_d6r26a_p2_r27p31_stateful_corrected_feature_window_synthetic_parity.py

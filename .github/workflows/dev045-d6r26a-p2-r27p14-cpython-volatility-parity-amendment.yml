name: dev045-d6r26a-p2-r27p14-cpython-volatility-parity-amendment

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p14-cpython-volatility-parity-amendment
  workflow_dispatch:

jobs:
  r27p14-cpython-volatility-parity-amendment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install narrow synthetic test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy pyarrow numba llvmlite
      - name: Run R27P14 contract and amendment tests
        run: |
          pytest -q tests/test_dev045_d6r26a_p2_r27p14_cpython_volatility_parity_amendment.py
      - name: Prove execution surfaces remain closed
        run: |
          PYTHONPATH=src python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r27p14_cpython_volatility_parity_amendment as r
          r.validate_r27p14_contract()
          assert r.REAL_HISTORICAL_BENCHMARK_AUTHORIZED is False
          assert r.REAL_HISTORICAL_DIAGNOSTIC_AUTHORIZED is False
          assert r.P2_ATTEMPT_CONSUMED is False
          assert r.MARKET_RAW_ARCHIVE_OPEN_AUTHORIZED is False
          print('R27P14_REAL_HISTORICAL_OPEN=NO')
          print('P2_ATTEMPT_CONSUMED=NO')
          print('MARKET_RAW_ARCHIVE_OPEN=NO')
          PY

name: dev045-d6r26a-p2-r18-generic-lane-materializer-integration-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r18-generic-lane-materializer-integration-preexecution
    paths:
      - src/multimarket/dev045_d6r26a_p2_r18_generic_lane_materializer_integration_preexecution.py
      - tests/test_dev045_d6r26a_p2_r18_generic_lane_materializer_integration_preexecution.py
      - docs/dev045_d6r26a_p2_r18_generic_lane_materializer_integration_preexecution.md
      - .github/workflows/dev045_d6r26a_p2_r18_generic_lane_materializer_integration_preexecution.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r18-real-engine-materializer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install narrow test surface
        run: |
          python -m pip install -U pip pytest numpy pyarrow==25.0.1

      - name: Restore exact patched hftbacktest wheel
        id: hft-wheel-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install maturin on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install maturin

      - name: Build exact patched simulator wheel on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nkaz001/hftbacktest.git /tmp/hftbacktest
          git -C /tmp/hftbacktest checkout --detach a244a14250b42d97fc305569c93c4117cd5e1dff

          test "$(git -C /tmp/hftbacktest rev-parse HEAD)" = \
            "a244a14250b42d97fc305569c93c4117cd5e1dff"

          python tools/patch_hftbacktest_244_safe.py /tmp/hftbacktest

          mkdir -p /tmp/dev045-hft244-wheel

          python -m pip wheel \
            --no-deps \
            --wheel-dir /tmp/dev045-hft244-wheel \
            /tmp/hftbacktest/py-hftbacktest

          test "$(
            find /tmp/dev045-hft244-wheel \
              -maxdepth 1 \
              -type f \
              -name 'hftbacktest-2.4.4-*.whl' |
            wc -l
          )" = "1"

      - name: Save exact patched wheel immediately after build
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install exact patched simulator and project
        run: |
          WHEEL="$(
            find /tmp/dev045-hft244-wheel \
              -maxdepth 1 \
              -type f \
              -name 'hftbacktest-2.4.4-*.whl' \
              -print \
              -quit
          )"

          test -n "$WHEEL"

          python -m pip install "$WHEEL"
          python -m pip install -e . --no-deps

      - name: Verify exact engine and serializer identities
        run: |
          python - <<'PY'
          import pyarrow

          from multimarket import (
              dev045_d6r26a_p2_r5_real_engine_binding_prehistorical as r5,
          )
          from multimarket import (
              dev045_d6r26a_p2_r16_canonical_row_parquet_serializer_preexecution as r16,
          )

          identity = r5.verify_engine_identity()

          assert identity.version == "2.4.4"
          assert pyarrow.__version__ == "25.0.1"
          assert r16.PYARROW_VERSION == "25.0.1"

          print("HFTBACKTEST_244_IDENTITY=PASS")
          print("PYARROW_25_0_1_IDENTITY=PASS")
          PY

      - name: Run R18 exact integration probes
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p2_r18_generic_lane_materializer_integration_preexecution.py

      - name: Prove campaign and historical surfaces remain sealed
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r18_generic_lane_materializer_integration_preexecution as r18,
          )

          r18.validate_r18_contract()

          assert r18.P2_ATTEMPT_CONSUMED is False
          assert r18.R4_FULL_RUNNER_BINDING_CREATED is False
          assert r18.EXECUTION_AUTHORIZATION_CREATED is False

          assert r18.HISTORICAL_FILE_IO_AUTHORIZED is False
          assert r18.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r18.HISTORICAL_SIMULATOR_IMPORT_AUTHORIZED is False
          assert r18.HISTORICAL_CANDIDATE_SIMULATION_AUTHORIZED is False
          assert r18.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r18.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r18.MODEL_FIT_AUTHORIZED is False
          assert r18.PNL_AUTHORIZED is False
          assert r18.AUG_OPEN_AUTHORIZED is False
          assert r18.SEP_PLUS_OPEN_AUTHORIZED is False
          assert r18.NON_BTC_OPEN_AUTHORIZED is False

          print("R18_GENERIC_LANE_MATERIALIZER=PASS")
          print("R4_LANE_ARTIFACT_SHAPE=BOUND")
          print("R8A_ATOMIC_PUBLISHER=BOUND")
          print("R15_SEQUENTIAL_REAL_ENGINE=BOUND")
          print("R16_CANONICAL_ROW_PARQUET=BOUND")
          print("R17_SHARED_DENSE_CACHE=BOUND")
          print("RAW_FEATURE_PASSES_PER_DAY=1")
          print("PER_LANE_RAW_FEATURE_RESCAN=FORBIDDEN")
          print("R4_FULL_RUNNER_BINDING=NO")
          print("HISTORICAL_SOURCE_OPEN=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

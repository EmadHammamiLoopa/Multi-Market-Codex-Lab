name: dev045-d6r26a-p2-r27p8-real-prefix-parity-localization-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p8-real-prefix-parity-localization-preexecution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r27p8-real-prefix-parity-localization-preexecution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install narrow synthetic test surface
        run: |
          python -m pip install -U pip
          python -m pip install pytest numpy==2.2.6 pyarrow==25.0.1 numba==0.67.0 llvmlite==0.49.0
          python -m pip install -e . --no-deps

      - name: Run R27P8 contract and localization tests
        run: |
          python -m pytest -q tests/test_dev045_d6r26a_p2_r27p8_real_prefix_parity_localization_preexecution.py

      - name: Prove CI cannot open the real historical diagnostic
        run: |
          python - <<'PY'
          import os
          from multimarket import dev045_d6r26a_p2_r27p8_real_prefix_parity_localization_preexecution as r

          r.validate_r27p8_contract()
          assert r.AUTH_ENV not in os.environ
          assert r.real_diagnostic_authorized() is False
          assert r.DIAGNOSTIC_PREFIX_ROWS == 100_000
          assert r.NO_TIMING is True
          assert r.NO_SPEED_GATE is True
          assert r.NO_BENCHMARK_MANIFEST is True
          assert r.FULL_JAN_JUL_RERUN_AUTHORIZED is False
          assert r.DURABLE_CONTEXT_WRITE_AUTHORIZED is False
          assert r.P2_ATTEMPT_CONSUMED is False
          assert r.SIMULATOR_LANE_AUTHORIZED is False
          assert r.MODEL_FIT_AUTHORIZED is False
          assert r.PNL_AUTHORIZED is False
          print('R27P8_PREEXECUTION_CONTRACT=PASS')
          print('REAL_HISTORICAL_SOURCE_OPENED_IN_CI=NO')
          print('R27P8_TIMING_PERFORMED=NO')
          print('BENCHMARK_MANIFEST_WRITTEN=NO')
          print('P2_ATTEMPT_CONSUMED=NO')
          print('FULL_JAN_JUL_RERUN=NO')
          print('SIMULATOR_RUN=NO')
          print('MODEL_FIT=NO')
          print('PNL=NO')
          PY

name: dev045-d6r26a-p2-r27p10-real-100k-amended-parity-recheck-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p10-real-100k-amended-parity-recheck-preexecution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r27p10-real-100k-amended-parity-recheck-preexecution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install narrow synthetic test surface
        run: |
          python -m pip install -U pip
          python -m pip install pytest numpy==2.2.6 pyarrow==25.0.1 numba==0.67.0 llvmlite==0.49.0
          python -m pip install -e . --no-deps

      - name: Run R27P10 contract and amended parity tests
        run: |
          python -m pytest -q tests/test_dev045_d6r26a_p2_r27p10_real_100k_amended_parity_recheck_preexecution.py

      - name: Prove CI cannot open real historical parity recheck
        run: |
          python - <<'PY'
          import os
          from multimarket import dev045_d6r26a_p2_r27p10_real_100k_amended_parity_recheck_preexecution as r

          r.validate_r27p10_contract()
          assert r.AUTH_ENV not in os.environ
          assert r.real_recheck_authorized() is False
          assert r.REAL_HISTORICAL_PARITY_RECHECK_REQUIRES_EXPLICIT_AUTHORIZATION is True
          assert r.PREFIX_ROWS == 100_000
          assert r.NO_TIMING is True
          assert r.NO_SPEED_GATE is True
          assert r.NO_MIDPOINT_BENCHMARK is True
          assert r.FULL_JAN_JUL_RERUN_AUTHORIZED is False
          assert r.P2_ATTEMPT_CONSUMED is False
          assert r.SIMULATOR_LANE_AUTHORIZED is False
          assert r.MODEL_FIT_AUTHORIZED is False
          assert r.PNL_AUTHORIZED is False
          print('R27P10_PREEXECUTION_CONTRACT=PASS')
          print('REAL_HISTORICAL_SOURCE_OPENED_IN_CI=NO')
          print('P2_ATTEMPT_CONSUMED=NO')
          print('FULL_JAN_JUL_RERUN=NO')
          print('SIMULATOR_RUN=NO')
          print('MODEL_FIT=NO')
          print('PNL=NO')
          PY

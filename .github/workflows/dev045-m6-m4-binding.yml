name: dev045-m6-m4-binding-contract

on:
  push:
    branches:
      - research/dev045-m6-m4-binding
  workflow_dispatch:

jobs:
  dev045-m6-m4-binding:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install -U pip pytest maturin numpy

      - name: Checkout exact upstream hftbacktest 2.4.4 source
        run: |
          git clone https://github.com/nkaz001/hftbacktest.git /tmp/hftbacktest
          git -C /tmp/hftbacktest checkout --detach a244a14250b42d97fc305569c93c4117cd5e1dff
          test "$(git -C /tmp/hftbacktest rev-parse HEAD)" = "a244a14250b42d97fc305569c93c4117cd5e1dff"

      - name: Apply frozen M1 fail-closed patch
        run: python tools/patch_hftbacktest_244_safe.py /tmp/hftbacktest

      - name: Build patched simulator
        run: python -m pip install /tmp/hftbacktest/py-hftbacktest

      - name: Install project
        run: python -m pip install -e .

      - name: Verify frozen lineage identities
        run: |
          test "$(git hash-object src/multimarket/dev045_m3_policy.py)" = "256644726f8478d2b76105bce97e5f2c536cabf6"
          test "$(git hash-object src/multimarket/dev045_m4_adapter.py)" = "7f6a321b4512dd1ec1edf94c79416e176ee75e1c"
          test "$(git hash-object src/multimarket/dev045_m5_fee_amendment.py)" = "4c4f4e974f164f4a55e24fa92ee4029c6e47a1f7"
          test "$(git hash-object src/multimarket/dev045_m6_economic_arena.py)" = "75e2ebe55d830202d3dfeb41382783c2fc670bc8"
          echo "FROZEN_LINEAGE_IDENTITIES=PASS"

      - name: Verify pinned simulator constants
        run: |
          python - <<'PY'
          import importlib.metadata as m
          from hftbacktest import order

          assert m.version("hftbacktest") == "2.4.4"
          assert order.BUY == 1
          assert order.SELL == -1
          assert order.NEW == 1
          assert order.FILLED == 3
          assert order.CANCELED == 4
          assert order.PARTIALLY_FILLED == 5

          print("HFTBACKTEST_VERSION=2.4.4")
          print("HFTBACKTEST_PATCHSET=ISSUE_312_ISSUE_316")
          print("ORDER_CONSTANT_IDENTITY=PASS")
          PY

      - name: Run M4 to M6 binding contracts
        run: |
          python -m pytest -q \
            tests/test_dev045_m4_m6_binding.py \
            tests/test_dev045_m4_adapter.py \
            tests/test_dev045_m6_economic_arena.py \
            tests/test_dev045_m5_fee_amendment.py \
            tests/test_dev045_m5_prereg.py \
            tests/test_dev045_m3_policy.py \
            tests/test_dev045_m1_parity.py \
            tests/test_dev045_m0_hft_compat.py

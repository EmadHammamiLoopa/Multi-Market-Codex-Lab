name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[ml]" pytest
      - run: python -c "import xgboost; print(xgboost.__version__)"
      - name: Prepare legacy EXP019 path invariant
        run: |
          sudo mkdir -p /home/emadh/Multi-Market/evidence/codex/exp017_aug1_phase_l_derived/BTCUSDT
          sudo touch /home/emadh/Multi-Market/evidence/codex/exp017_aug1_phase_l_derived/BTCUSDT/2026-08-01_FEATURES250.csv
      - run: python -m unittest discover -s tests -v


  p10-transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install             "numpy==2.5.2"             "scikit-learn==1.9.0"             "pytest==7.4.3"             "numba==0.67.0"             "llvmlite==0.49.0"
          python -m pip install -e . --no-deps
      - run: |
          python - <<'PY'
          import sys
          import numpy
          import sklearn
          import pytest
          import numba
          import llvmlite
          print("python", sys.version.split()[0])
          print("numpy", numpy.__version__)
          print("scikit-learn", sklearn.__version__)
          print("pytest", pytest.__version__)
          print("numba", numba.__version__)
          print("llvmlite", llvmlite.__version__)
          PY
      - run: python -m pytest -q tests/p10_test_minirocket_transform.py tests/p10_test_minirocket_runner.py


  dev031-p0-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/dev031_p0_test_event_depth_audit.py


  dev031-p0a-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/dev031_p0a_test_event_depth_audit.py


  dev031-p1a-materialization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev
      - run: python -m pip install -e . pytest scikit-learn
      - run: python -m pytest -q tests/test_dev031_p1a_event_depth_materialize.py


  dev031-p1b-incremental:

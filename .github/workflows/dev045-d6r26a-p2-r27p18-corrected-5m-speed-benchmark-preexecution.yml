name: dev045-d6r26a-p2-r27p18-corrected-5m-speed-benchmark-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p18-corrected-5m-speed-benchmark-preexecution

jobs:
  r27p18-corrected-5m-speed-benchmark-preexecution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install narrow synthetic test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy pyarrow numba llvmlite
      - name: Run R27P18 contract and synthetic full-context parity tests
        run: pytest -q tests/test_dev045_d6r26a_p2_r27p18_corrected_5m_speed_benchmark_preexecution.py
      - name: Prove CI cannot open real historical benchmark
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r27p18_corrected_5m_speed_benchmark_preexecution as r
          r.validate_r27p18_contract()
          assert r.real_benchmark_authorized({}) is False
          assert r.P2_ATTEMPT_CONSUMED is False
          assert r.R27P17_RERUN_AUTHORIZED is False
          assert r.FULL_JAN_JUL_RERUN_AUTHORIZED is False
          assert r.MARKET_RAW_ARCHIVE_OPEN_AUTHORIZED is False
          print('R27P18_CI_EXECUTION_SURFACES_CLOSED=PASS')
          PY

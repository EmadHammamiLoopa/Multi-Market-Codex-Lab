name: dev045-m5-public-fee-amendment

on:
  push:
    branches:
      - research/dev045-m5-fee-freeze
  workflow_dispatch:

jobs:
  fee-amendment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -e . pytest numpy
      - name: Validate frozen public fee amendment
        run: python -m pytest -q tests/test_dev045_m5_fee_amendment.py

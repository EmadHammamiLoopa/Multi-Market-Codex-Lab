name: dev045-d6r26a-p2-r13a-dual-stream-eof-memory-amendment

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r13a-dual-stream-eof-memory-amendment
    paths:
      - src/multimarket/dev045_d6r26a_p2_r13a_dual_stream_eof_memory_amendment.py
      - tests/test_dev045_d6r26a_p2_r13a_dual_stream_eof_memory_amendment.py
      - docs/dev045_d6r26a_p2_r13a_dual_stream_eof_memory_amendment.md
      - .github/workflows/dev045_d6r26a_p2_r13a_dual_stream_eof_memory_amendment.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r13a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r13a:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install narrow test surface
        run: |
          python -m pip install -U pip pytest numpy
          python -m pip install -e . --no-deps

      - name: Run immutable R13 plus R13A regression tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p2_r13_streaming_raw_decoder_preexecution.py \
            tests/test_dev045_d6r26a_p2_r13a_dual_stream_eof_memory_amendment.py

      - name: Prove previous-failure guards and historical seal
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r13a_dual_stream_eof_memory_amendment as r13a,
          )

          r13a.validate_r13a_contract()

          assert r13a.NATURAL_END_OF_SOURCE_IS_VALID_TERMINAL is True
          assert r13a.FINAL_TIMESTAMP_GROUP_FLUSH_REQUIRED is True
          assert r13a.FIXED_EVENT_TARGET is None
          assert r13a.FIXED_WAKEUP_TARGET is None

          assert r13a.TOTAL_RSS_ABORT_THRESHOLD_BYTES is None
          assert r13a.TOTAL_RSS_IS_BOUNDEDNESS_GATE is False

          assert r13a.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r13a.SIMULATOR_IMPORT_AUTHORIZED is False
          assert r13a.CANDIDATE_SIMULATION_AUTHORIZED is False
          assert r13a.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r13a.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r13a.MODEL_FIT_AUTHORIZED is False
          assert r13a.PNL_AUTHORIZED is False

          print("R13A_DUAL_STREAM=PASS")
          print("R9_LOCAL_PARITY=BOUND")
          print("R9_EXCHANGE_MIDPOINT_PARITY=BOUND")
          print("NATURAL_EOF_VALID=YES")
          print("FINAL_GROUP_FLUSH=YES")
          print("FIXED_EVENT_TARGET=NONE")
          print("FIXED_WAKEUP_TARGET=NONE")
          print("TOTAL_RSS_ABORT_GATE=NONE")
          print("FULL_HISTORY_REAL_PATH=FORBIDDEN")
          print("HISTORICAL_SOURCE_OPEN=NO")
          print("CANDIDATE_HISTORICAL_SIMULATION=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

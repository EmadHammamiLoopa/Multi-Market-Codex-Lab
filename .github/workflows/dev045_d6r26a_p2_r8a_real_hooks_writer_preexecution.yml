name: dev045-d6r26a-p2-r8a-real-hooks-writer-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r8a-real-hooks-writer-preexecution
    paths:
      - src/multimarket/dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.py
      - tests/test_dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.py
      - docs/dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.md
      - .github/workflows/dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.py
      - tests/test_dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.py
      - docs/dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.md
      - .github/workflows/dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r8a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r8a-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install narrow R8A surface
        run: |
          python -m pip install -U pip pytest numpy
          python -m pip install -e . --no-deps

      - name: Prove simulator remains absent
        run: |
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("hftbacktest") is None

          print("HFTBACKTEST_INSTALLED=NO")
          print("SIMULATOR_IMPORT=NO")
          print("HISTORICAL_SOURCE_OPEN=NO")
          PY

      - name: Run R8A real-hooks preexecution tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution.py

      - name: Prove execution remains sealed
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r8a_real_hooks_writer_preexecution as r8a

          r8a.validate_r8a_contract()

          assert r8a.FEATURE_LABEL_EXECUTOR_FROZEN is False
          assert r8a.EXECUTION_AUTHORIZATION_CREATED is False
          assert r8a.HISTORICAL_FILE_IO_AUTHORIZED is False
          assert r8a.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r8a.SIMULATOR_IMPORT_AUTHORIZED is False
          assert r8a.CANDIDATE_SIMULATION_AUTHORIZED is False
          assert r8a.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r8a.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r8a.MODEL_FIT_AUTHORIZED is False
          assert r8a.PNL_AUTHORIZED is False

          print("R8A_REAL_SOURCE_HOOK=IMPLEMENTED_UNBOUND")
          print("R8A_READ_ONLY_MMAP=IMPLEMENTED_UNBOUND")
          print("R8A_REAL_ENGINE_FACTORY=IMPLEMENTED_LAZY_UNBOUND")
          print("R8A_ATOMIC_WRITER=IMPLEMENTED_UNBOUND")
          print("FEATURE_LABEL_EXECUTOR_FROZEN=NO")
          print("ATTEMPT_MARKER_WRITE=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

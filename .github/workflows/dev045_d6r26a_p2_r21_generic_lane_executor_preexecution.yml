name: dev045-d6r26a-p2-r21-generic-lane-executor-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r21-generic-lane-executor-preexecution
    paths:
      - src/multimarket/dev045_d6r26a_p2_r21_generic_lane_executor_preexecution.py
      - tests/test_dev045_d6r26a_p2_r21_generic_lane_executor_preexecution.py
      - docs/dev045_d6r26a_p2_r21_generic_lane_executor_preexecution.md
      - .github/workflows/dev045_d6r26a_p2_r21_generic_lane_executor_preexecution.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r21:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install narrow test surface
        run: |
          python -m pip install -U pip pytest numpy pyarrow==25.0.1

      - name: Restore exact patched hftbacktest wheel
        id: hft-wheel-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install maturin on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install maturin

      - name: Build exact patched simulator wheel on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nkaz001/hftbacktest.git /tmp/hftbacktest
          git -C /tmp/hftbacktest checkout --detach a244a14250b42d97fc305569c93c4117cd5e1dff

          test "$(git -C /tmp/hftbacktest rev-parse HEAD)" = \
            "a244a14250b42d97fc305569c93c4117cd5e1dff"

          python tools/patch_hftbacktest_244_safe.py /tmp/hftbacktest

          mkdir -p /tmp/dev045-hft244-wheel

          python -m pip wheel \
            --no-deps \
            --wheel-dir /tmp/dev045-hft244-wheel \
            /tmp/hftbacktest/py-hftbacktest

          test "$(
            find /tmp/dev045-hft244-wheel \
              -maxdepth 1 \
              -type f \
              -name 'hftbacktest-2.4.4-*.whl' |
            wc -l
          )" = "1"

      - name: Save exact patched wheel after build
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install exact patched simulator and project
        run: |
          WHEEL="$(
            find /tmp/dev045-hft244-wheel \
              -maxdepth 1 \
              -type f \
              -name 'hftbacktest-2.4.4-*.whl' \
              -print \
              -quit
          )"

          test -n "$WHEEL"

          python -m pip install "$WHEEL"
          python -m pip install -e . --no-deps

      - name: Verify exact engine identity
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r5_real_engine_binding_prehistorical as r5,
          )

          identity = r5.verify_engine_identity()

          assert identity.version == "2.4.4"

          print("HFTBACKTEST_244_IDENTITY=PASS")
          PY

      - name: Run R21 generic lane-executor probes
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p2_r21_generic_lane_executor_preexecution.py

      - name: Prove historical and attempt surfaces remain sealed
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r21_generic_lane_executor_preexecution as r21,
          )

          r21.validate_r21_contract()

          assert r21.FRESH_ENGINE_PER_LANE_REQUIRED is True
          assert r21.ONE_ENGINE_FOR_ALL_CANDIDATES_IN_LANE is True

          assert r21.FILL_QTY_FROM_REMAINING_LEAVES_DELTA is True
          assert r21.DIRECT_EXEC_QTY_ACCUMULATION_FORBIDDEN is True

          assert r21.MARKOUTS_USE_R20_FILE_BACKED_INDEX is True
          assert r21.FULL_MIDPOINT_HISTORY_MATERIALIZATION_FORBIDDEN is True
          assert r21.PER_CANDIDATE_RAW_MIDPOINT_SCAN_FORBIDDEN is True

          assert r21.FIXED_EVENT_TARGET is None
          assert r21.FIXED_WAKEUP_TARGET is None

          assert r21.P2_ATTEMPT_CONSUMED is False
          assert r21.HISTORICAL_FILE_IO_AUTHORIZED is False
          assert r21.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r21.HISTORICAL_CANDIDATE_SIMULATION_AUTHORIZED is False
          assert r21.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r21.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r21.MODEL_FIT_AUTHORIZED is False
          assert r21.PNL_AUTHORIZED is False

          print("R21_GENERIC_LANE_EXECUTOR=PASS")
          print("FRESH_ENGINE_PER_LANE=YES")
          print("ONE_ENGINE_FOR_CANDIDATES_WITHIN_LANE=YES")
          print("FILL_QTY_SOURCE=REMAINING_LEAVES_DELTA")
          print("DIRECT_EXEC_QTY_ACCUMULATION=FORBIDDEN")
          print("MARKOUT_SOURCE=R20_FILE_BACKED_INDEX")
          print("NATURAL_EOF_BEFORE_TERMINAL=VALID")
          print("FIXED_EVENT_TARGET=NONE")
          print("FIXED_WAKEUP_TARGET=NONE")
          print("HISTORICAL_SOURCE_OPEN=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

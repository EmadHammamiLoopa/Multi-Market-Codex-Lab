name: dev045-m1-replay-parity

on:
  push:
    branches:
      - research/dev045-m1-replay-parity
  workflow_dispatch:

jobs:
  dev045-m1-replay-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pytest "hftbacktest==2.4.4"
      - run: python -m pytest -q tests/test_dev045_m1_parity.py tests/test_dev045_m0_hft_compat.py

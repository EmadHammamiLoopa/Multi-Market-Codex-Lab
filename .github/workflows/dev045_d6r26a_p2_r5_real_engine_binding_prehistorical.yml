name: dev045-d6r26a-p2-r5-real-engine-binding-prehistorical

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r5-real-engine-binding-prehistorical
    paths:
      - src/multimarket/dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.py
      - tests/test_dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.py
      - docs/dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.md
      - .github/workflows/dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.py
      - tests/test_dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.py
      - docs/dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.md
      - .github/workflows/dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r5-real-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pytest
        run: python -m pip install -U pip pytest

      - name: Restore exact patched hftbacktest wheel
        id: hft-wheel-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install maturin on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: python -m pip install maturin

      - name: Build exact patched simulator wheel on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nkaz001/hftbacktest.git /tmp/hftbacktest
          git -C /tmp/hftbacktest checkout --detach a244a14250b42d97fc305569c93c4117cd5e1dff
          test "$(git -C /tmp/hftbacktest rev-parse HEAD)" = "a244a14250b42d97fc305569c93c4117cd5e1dff"
          python tools/patch_hftbacktest_244_safe.py /tmp/hftbacktest
          mkdir -p /tmp/dev045-hft244-wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/dev045-hft244-wheel /tmp/hftbacktest/py-hftbacktest
          test "$(find /tmp/dev045-hft244-wheel -maxdepth 1 -type f -name 'hftbacktest-2.4.4-*.whl' | wc -l)" = "1"

      - name: Save exact patched wheel immediately after build
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install exact patched simulator and project
        run: |
          WHEEL="$(find /tmp/dev045-hft244-wheel -maxdepth 1 -type f -name 'hftbacktest-2.4.4-*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install "$WHEEL"
          python -m pip install -e . --no-deps

      - name: Verify exact engine identity
        run: |
          python - <<'PY'
          import hftbacktest as h
          from multimarket import dev045_d6r26a_p2_r5_real_engine_binding_prehistorical as r5
          x = r5.verify_engine_identity()
          assert x.version == "2.4.4"
          assert (x.gtx, x.none, x.new, x.expired, x.filled, x.canceled, x.partially_filled, x.rejected) == (1, 0, 1, 2, 3, 4, 5, 6)
          assert int(h.LIMIT) == 0
          assert int(h.MARKET) == 1
          print("HFTBACKTEST_244_IDENTITY=PASS")
          print("GTX_STATUS_IDENTITY=PASS")
          print("LIMIT_MARKET_IDENTITY=PASS")
          PY

      - name: Run R5 real-engine synthetic probes
        run: |
          python -m pytest -q tests/test_dev045_d6r26a_p2_r5_real_engine_binding_prehistorical.py

      - name: Prove historical surface remains sealed
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r5_real_engine_binding_prehistorical as r5
          r5.validate_r5_contract()
          assert r5.SYNTHETIC_FIXTURE_ONLY is True
          assert r5.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r5.HISTORICAL_FILE_IO_AUTHORIZED is False
          assert r5.CANONICAL_RUNNER_BINDING_AUTHORIZED is False
          assert r5.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r5.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r5.MODEL_FIT_AUTHORIZED is False
          assert r5.PNL_AUTHORIZED is False
          assert r5.LIVE_TRADING_AUTHORIZED is False
          print("REAL_ENGINE_PROBE=PASS")
          print("HISTORICAL_SOURCE_OPENED=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("CANONICAL_LABEL_WRITE=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

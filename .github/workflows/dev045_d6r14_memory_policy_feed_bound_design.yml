name: dev045-d6r14-memory-policy-feed-bound-design

on:
  push:
    branches:
      - research/dev045-m6-d6r14-memory-policy-feed-bound-design
  pull_request:
    paths:
      - src/multimarket/dev045_d6r14_memory_policy.py
      - tests/test_dev045_d6r14_memory_policy.py
      - evidence/dev045_d6r14_memory_policy_feed_bound_design.json
      - .github/workflows/dev045_d6r14_memory_policy_feed_bound_design.yml

jobs:
  dev045-d6r14-memory-policy-feed-bound-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run D6R14 design tests
        run: |
          PYTHONPATH=src python -m unittest discover \
            -s tests \
            -p 'test_dev045_d6r14_memory_policy.py' \
            -v
      - name: Verify design is non-executable
        run: |
          PYTHONPATH=src python - <<'PY'
          from multimarket import dev045_d6r14_memory_policy as p

          assert p.STAGE_MODE == "DESIGN_ONLY_NOT_EXECUTED"
          assert not any(p.EXECUTION_AUTHORIZATION_FLAGS)
          assert p.D6R12_RERUN_FORBIDDEN is True
          assert p.D6R13_RERUN_FORBIDDEN is True
          assert p.D6R13_DIAGNOSTIC_QUESTION_ANSWERED is True
          assert p.ADDITIONAL_BOUNDED_MEMORY_DIAGNOSTIC_REQUIRED is False
          assert p.TOTAL_RSS_ABORT_THRESHOLD_BYTES is None
          assert p.RUNTIME_ABORT_ON_PROCESS_SWAP_GROWTH is True
          assert p.NATURAL_END_OF_DATA_IS_VALID_TERMINAL is True
          assert p.FIXED_WAKEUP_TARGET_REQUIRED is False
          print("D6R14_NON_EXECUTABLE_DESIGN=PASS")
          PY

name: dev045-d6r26a-p2-r23-final-one-shot-readiness-authorization-preflight

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r23-final-one-shot-readiness-authorization-preflight
    paths:
      - src/multimarket/dev045_d6r26a_p2_r23_final_one_shot_readiness_authorization_preflight.py
      - tests/test_dev045_d6r26a_p2_r23_final_one_shot_readiness_authorization_preflight.py
      - docs/dev045_d6r26a_p2_r23_final_one_shot_readiness_authorization_preflight.md
      - .github/workflows/dev045_d6r26a_p2_r23_final_one_shot_readiness_authorization_preflight.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r23-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r23:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install narrow test surface
        run: |
          python -m pip install -U pip pytest numpy pyarrow==25.0.1
          python -m pip install -e . --no-deps

      - name: Run R23 readiness contract tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p2_r23_final_one_shot_readiness_authorization_preflight.py

      - name: Prove R23 cannot consume P2
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r23_final_one_shot_readiness_authorization_preflight as r23,
          )

          r23.validate_r23_contract()

          assert r23.EXPECTED_SOURCE_COUNT == 7
          assert r23.EXPECTED_TOTAL_LANES == 280

          assert r23.SOURCE_METADATA_STAT_AUTHORIZED is True

          assert r23.HISTORICAL_PAYLOAD_READ_AUTHORIZED is False
          assert r23.SOURCE_NPY_LOAD_AUTHORIZED is False
          assert r23.SOURCE_MMAP_AUTHORIZED is False
          assert r23.SOURCE_REHASH_AUTHORIZED is False
          assert r23.SOURCE_ROW_SCAN_AUTHORIZED is False

          assert (
              r23.SOURCE_SHA_PREATTEMPT_VERIFICATION_DEFERRED_TO_R22
              is True
          )

          assert (
              r23.SOURCE_ROWS_PREATTEMPT_VERIFICATION_DEFERRED_TO_R22
              is True
          )

          assert r23.EXECUTION_START_FUNCTION_IMPLEMENTED is False
          assert r23.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r23.HISTORICAL_SIMULATOR_LANE_AUTHORIZED is False

          assert r23.P2_ATTEMPT_CONSUMED is False
          assert r23.ONE_SHOT_EXECUTION_STARTED is False
          assert r23.MODEL_FIT_AUTHORIZED is False
          assert r23.PNL_AUTHORIZED is False

          print("R23_FINAL_READINESS_PREFLIGHT=PASS")
          print("SOURCE_METADATA_STAT=AUTHORIZED")
          print("SOURCE_PAYLOAD_READ=NO")
          print("SOURCE_REHASH=NO")
          print("SOURCE_MMAP=NO")
          print("EXACT_SHA_ROWS_CHECK=DEFERRED_TO_R22_PREATTEMPT")
          print("EXACT_R22_HEAD_REQUIRED=YES")
          print("CLEAN_WORKTREE_REQUIRED=YES")
          print("OUTPUT_ROOT_PRISTINE_REQUIRED=YES")
          print("ATTEMPT_MARKER_ABSENT_REQUIRED=YES")
          print("SCRATCH_ROOT_PRISTINE_REQUIRED=YES")
          print("PREEXEC_MEMORY_GATE=YES")
          print("EXECUTION_STARTED=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

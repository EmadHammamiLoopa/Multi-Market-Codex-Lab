name: dev045-d6r26a-p2-r23a-execution-head-lineage-amendment-preflight

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r23a-execution-head-lineage-amendment-preflight
    paths:
      - src/multimarket/dev045_d6r26a_p2_r23a_execution_head_lineage_amendment_preflight.py
      - tests/test_dev045_d6r26a_p2_r23a_execution_head_lineage_amendment_preflight.py
      - docs/dev045_d6r26a_p2_r23a_execution_head_lineage_amendment_preflight.md
      - .github/workflows/dev045_d6r26a_p2_r23a_execution_head_lineage_amendment_preflight.yml
  workflow_dispatch:

jobs:
  d6r26a-p2-r23a:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install narrow test surface
        run: |
          python -m pip install -U pip pytest numpy pyarrow==25.0.1
          python -m pip install -e . --no-deps

      - name: Run R23A execution-head amendment tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p2_r23a_execution_head_lineage_amendment_preflight.py

      - name: Prove R23A remains non-consuming
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r23a_execution_head_lineage_amendment_preflight as r23a,
          )

          r23a.validate_r23a_contract()

          assert (
              r23a.EXACT_EXECUTION_HEAD_MUST_BE_SUPPLIED_BY_ONE_SHOT_WRAPPER
              is True
          )

          assert r23a.HISTORICAL_PAYLOAD_READ_AUTHORIZED is False
          assert r23a.SOURCE_NPY_LOAD_AUTHORIZED is False
          assert r23a.SOURCE_MMAP_AUTHORIZED is False
          assert r23a.SOURCE_REHASH_AUTHORIZED is False
          assert r23a.SOURCE_ROW_SCAN_AUTHORIZED is False

          assert r23a.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r23a.HISTORICAL_SIMULATOR_LANE_AUTHORIZED is False
          assert r23a.CANONICAL_LABEL_WRITE_AUTHORIZED is False

          assert r23a.P2_ATTEMPT_CONSUMED is False
          assert r23a.ONE_SHOT_EXECUTION_STARTED is False
          assert r23a.MODEL_FIT_AUTHORIZED is False
          assert r23a.PNL_AUTHORIZED is False

          print("R23A_EXECUTION_HEAD_AMENDMENT=PASS")
          print("EXACT_EXECUTION_HEAD=SUPPLIED_BY_FINAL_WRAPPER")
          print("SOURCE_PAYLOAD_READ=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          PY

name: dev045-d6r26a-p2-r1-canonical-label-materializer-preauth

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r1-canonical-label-materializer-preauth
    paths:
      - src/multimarket/dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.py
      - tests/test_dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.py
      - docs/dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.md
      - .github/workflows/dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.py
      - tests/test_dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.py
      - docs/dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.md
      - .github/workflows/dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r1-preauth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r1-preauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pure test surface only
        run: |
          python -m pip install -U pip pytest
          python -m pip install -e . --no-deps
      - name: Prove simulator absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("hftbacktest") is None
          print("HFTBACKTEST_INSTALLED=NO")
          print("SIMULATOR_BUILD=NO")
          PY
      - name: Run frozen D6R26A pure contracts
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.py \
            tests/test_dev045_d6r26a_p1_synthetic_candidate_labeler.py \
            tests/test_dev045_d6r26a_p2_jan_jul_consumed_development_label_design.py \
            tests/test_dev045_d6r26a_p2_r1_canonical_label_materializer_preauth.py
      - name: Prove P2-R1 preauth closure
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r1_canonical_label_materializer_preauth as p
          p.validate_preauth_contract()
          assert p.PREAUTH_ONLY is True
          assert p.FROZEN_SOURCE_REGISTRY_REQUIRED is True
          assert p.FROZEN_SOURCE_REGISTRY_EMBEDDED is False
          assert p.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert p.HISTORICAL_SOURCE_HASH_AUTHORIZED is False
          assert p.CANDIDATE_SIMULATION_AUTHORIZED is False
          assert p.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert p.MODEL_FIT_AUTHORIZED is False
          assert p.PNL_AUTHORIZED is False
          assert p.LIVE_TRADING_AUTHORIZED is False
          assert len(p.build_materialization_plan()) == 280
          print("D6R26A_P2_R1_PREAUTH=PASS")
          print("JAN_JUL_DATA_ROLE=CONSUMED_DEVELOPMENT")
          print("SOURCE_REGISTRY_REQUIRED=YES")
          print("SOURCE_REGISTRY_INVENTED=NO")
          print("HISTORICAL_SOURCE_OPENED=NO")
          print("CANDIDATE_SIMULATION=NO")
          print("CANONICAL_LABEL_WRITE=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

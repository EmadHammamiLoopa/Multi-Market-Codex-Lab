name: dev045-d6r25-post-d6r24-economic-forensic-design-contract

on:
  push:
    branches:
      - research/dev045-m6-d6r25-post-d6r24-economic-forensic-design
    paths:
      - src/multimarket/dev045_d6r25_post_d6r24_economic_forensic_design.py
      - docs/dev045_d6r25_post_d6r24_economic_forensic_design.md
      - tests/test_dev045_d6r25_post_d6r24_economic_forensic_design.py
      - .github/workflows/dev045_d6r25_post_d6r24_economic_forensic_design_contract.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r25_post_d6r24_economic_forensic_design.py
      - docs/dev045_d6r25_post_d6r24_economic_forensic_design.md
      - tests/test_dev045_d6r25_post_d6r24_economic_forensic_design.py
      - .github/workflows/dev045_d6r25_post_d6r24_economic_forensic_design_contract.yml

jobs:
  d6r25-economic-forensic-design-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and pytest
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest

      - name: Run D6R25 design contract tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r25_post_d6r24_economic_forensic_design.py

      - name: Prove design-only closure
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r25_post_d6r24_economic_forensic_design as d

          d.validate_design_contract()
          assert d.INPUT_SURFACE == "FROZEN_D6R24_DAY_ARTIFACTS_ONLY"
          assert d.ONE_DAY_AT_A_TIME is True
          assert d.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert d.SIMULATOR_AUTHORIZED is False
          assert d.D6R24_RERUN_AUTHORIZED is False
          assert d.ECONOMIC_ARENA_RERUN_AUTHORIZED is False
          assert d.FEE_CHANGE_AUTHORIZED is False
          assert d.POLICY_RETUNING_AUTHORIZED is False
          assert d.POLICY_PROMOTION_AUTHORIZED is False
          assert d.LIVE_TRADING_AUTHORIZED is False
          assert d.DESIGN_EXECUTED_DURING_IMPLEMENTATION is False
          assert d.D6R24_DAY_ARTIFACTS_OPENED_DURING_IMPLEMENTATION is False
          assert d.D6R24_DAY_ARTIFACTS_HASHED_DURING_IMPLEMENTATION is False
          print("D6R25_DESIGN_ONLY=YES")
          print("D6R24_DAY_ARTIFACTS_OPENED=NO")
          print("HISTORICAL_SOURCE_OPENED=NO")
          print("SIMULATOR=NO")
          print("ECONOMIC_ARENA_RERUN=NO")
          print("D6R24_RERUN=NO")
          print("FEE_CHANGE=NO")
          print("POLICY_RETUNING=NO")
          print("LIVE_TRADING=NO")
          PY

name: dev045-d6r26a-p2-r27p2-bounded-real-numba-benchmark-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p2-bounded-real-numba-benchmark-preexecution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r27p2-bounded-benchmark-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install narrow synthetic test surface
        run: |
          python -m pip install -U pip
          python -m pip install pytest numpy==2.2.6 pyarrow==25.0.1 numba==0.67.0 llvmlite==0.49.0
          python -m pip install -e . --no-deps

      - name: Run R27P2 synthetic bounded benchmark tests
        run: |
          python -m pytest -q tests/test_dev045_d6r26a_p2_r27p2_bounded_real_numba_benchmark_preexecution.py

      - name: Prove historical execution remains disabled in CI
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r27p2_bounded_real_numba_benchmark_preexecution as r
          r.validate_r27p2_contract()
          assert r.P2_ATTEMPT_CONSUMED is False
          assert r.FULL_DAY_CONTEXT_BUILD_AUTHORIZED is False
          assert r.FULL_JAN_JUL_RERUN_AUTHORIZED is False
          assert r.DURABLE_CONTEXT_WRITE_AUTHORIZED is False
          assert r.SIMULATOR_LANE_AUTHORIZED is False
          assert r.MODEL_FIT_AUTHORIZED is False
          assert r.PNL_AUTHORIZED is False
          assert r.BENCHMARK_PREFIX_ONLY is True
          assert r.GATE_PREFIX_ROWS == 5_000_000
          print('R27P2_BOUNDED_BENCHMARK_PROTOCOL=PASS')
          print('REAL_HISTORICAL_SOURCE_OPENED_IN_CI=NO')
          print('FULL_DAY_CONTEXT_BUILD=NO')
          print('FULL_JAN_JUL_RERUN=NO')
          print('SIMULATOR_RUN=NO')
          print('P2_ATTEMPT_CONSUMED=NO')
          print('MODEL_FIT=NO')
          print('PNL=NO')
          PY

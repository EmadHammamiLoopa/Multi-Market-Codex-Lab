name: dev045-d6r20-q3-real-engine-qualification-contract

on:
  push:
    branches:
      - research/dev045-m6-d6r20-q3-order-values-validator-fix
  pull_request:
    paths:
      - src/multimarket/dev045_d6r20_q3_real_engine_qualification.py
      - tests/test_dev045_d6r20_q3_real_engine_qualification.py
      - .github/workflows/dev045_d6r20_q3_real_engine_qualification_contract.yml

jobs:
  q3-validator-and-v2-engine-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build and test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest maturin

      - name: Checkout and patch exact hftbacktest 2.4.4 upstream
        run: |
          git clone https://github.com/nkaz001/hftbacktest.git /tmp/hftbacktest-q3-v2
          git -C /tmp/hftbacktest-q3-v2 checkout --detach a244a14250b42d97fc305569c93c4117cd5e1dff
          test "$(git -C /tmp/hftbacktest-q3-v2 rev-parse HEAD)" = "a244a14250b42d97fc305569c93c4117cd5e1dff"
          python tools/patch_hftbacktest_244_safe_v2.py /tmp/hftbacktest-q3-v2
          git -C /tmp/hftbacktest-q3-v2 diff --check

      - name: Build and install isolated V2 engine
        run: |
          python -m pip install --force-reinstall --no-build-isolation /tmp/hftbacktest-q3-v2/py-hftbacktest
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import hftbacktest

          assert importlib.metadata.version("hftbacktest") == "2.4.4"
          binaries = tuple(Path(hftbacktest.__file__).resolve().parent.glob("_hftbacktest*.so"))
          assert len(binaries) == 1
          print("HFTBACKTEST_VERSION=2.4.4")
          print(f"Q3_CI_COMPILED_ARTIFACT={binaries[0]}")
          PY

      - name: Run Q3 and frozen execution regressions
        run: |
          q3_ci_sha="$(python -c 'import hashlib,hftbacktest; from pathlib import Path; p=tuple(Path(hftbacktest.__file__).resolve().parent.glob("_hftbacktest*.so")); assert len(p)==1; print(hashlib.sha256(p[0].read_bytes()).hexdigest())')"
          DEV045_Q3_V2_ENGINE_TEST=1 \
          DEV045_Q3_TEST_ENGINE_SHA256="${q3_ci_sha}" \
          DEV045_Q2_V2_ENGINE_TEST=1 \
          DEV045_Q2_TEST_ENGINE_SHA256="${q3_ci_sha}" \
          DEV045_HFT244_PATCH_EXPECTATION=v2 \
          DEV045_HFT244_SOURCE_ROOT=/tmp/hftbacktest-q3-v2 \
          DEV045_HFT244_EXPECTED_BINARY_SHA256="${q3_ci_sha}" \
            python -m pytest -q \
            tests/test_dev045_d6r20_q3_real_engine_qualification.py \
            tests/test_dev045_d6r20_q2_real_engine_qualification.py \
            tests/test_dev045_d6r20_real_engine_qualification.py \
            tests/test_dev045_d6r20_residual_flatten_driver.py \
            tests/test_dev045_d6r19_response_batch_replacement_driver.py \
            tests/test_dev045_m4_m6_binding.py \
            tests/test_dev045_hft244_taker_multifill_accounting.py
          echo "Q3_CI_V2_COMPILED_SHA256=${q3_ci_sha}"

      - name: Prove historical and economic execution remain closed
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r20_q3_real_engine_qualification as q3

          assert q3.QUALIFICATION_EXECUTION_AUTHORIZED_BY_DEFAULT is False
          assert q3.REAL_HISTORICAL_QUALIFICATION_EXECUTED is False
          assert q3.Q1_RERUN_AUTHORIZED is False
          assert q3.Q2_RERUN_AUTHORIZED is False
          assert q3.CANONICAL_RUNNER_IMPLEMENTED is False
          assert q3.CANONICAL_ECONOMIC_ATTEMPT is False
          assert q3.CANONICAL_ATTEMPT_CONSUMED is False
          assert q3.ECONOMIC_ARENA_EXECUTED is False
          assert q3.STRATEGY_RANKING_PERFORMED is False
          assert q3.LIVE_TRADING_AUTHORIZED is False

          print("HISTORICAL_SOURCE_OPENED_IN_CI=NO")
          print("HISTORICAL_SOURCE_HASHED_IN_CI=NO")
          print("Q1_RERUN_IN_CI=NO")
          print("Q2_RERUN_IN_CI=NO")
          print("Q3_REAL_HISTORICAL_QUALIFICATION_EXECUTED_IN_CI=NO")
          print("CANONICAL_ECONOMICS_EXECUTED_IN_CI=NO")
          PY

name: dev045-d6r20-real-engine-qualification-contract

on:
  push:
    branches:
      - research/dev045-m6-d6r20-real-engine-qualification
      - research/dev045-m6-d6r20-q1-flatten-execution-forensic
  pull_request:
    paths:
      - src/multimarket/dev045_d6r20_real_engine_qualification.py
      - src/multimarket/dev045_d6r20_q1_flatten_forensic_driver.py
      - tests/test_dev045_d6r20_real_engine_qualification.py
      - tests/test_dev045_d6r20_q1_flatten_forensic_driver.py
      - tests/test_dev045_d6r20_residual_flatten_driver.py
      - tests/test_dev045_d6r19_response_batch_replacement_driver.py
      - tests/test_dev045_d6r19_canonical_runner.py
      - tests/test_dev045_d6r18_canonical_runner.py
      - .github/workflows/dev045_d6r20_real_engine_qualification.yml

jobs:
  synthetic-qualification-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install unit-test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest

      - name: Run synthetic qualification and frozen regression contracts
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r20_residual_flatten_driver.py \
            tests/test_dev045_d6r19_response_batch_replacement_driver.py \
            tests/test_dev045_d6r20_real_engine_qualification.py \
            tests/test_dev045_d6r20_q1_flatten_forensic_driver.py \
            tests/test_dev045_d6r19_canonical_runner.py \
            tests/test_dev045_d6r18_canonical_runner.py

      - name: Verify qualification and economics remain closed in CI
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r20_real_engine_qualification as q

          assert q.QUALIFICATION_EXECUTION_AUTHORIZED_BY_DEFAULT is False
          assert q.REAL_HISTORICAL_QUALIFICATION_EXECUTED is False
          assert q.CANONICAL_RUNNER_IMPLEMENTED is False
          assert q.CANONICAL_ECONOMIC_ATTEMPT is False
          assert q.CANONICAL_ATTEMPT_CONSUMED is False
          assert q.ECONOMIC_ARENA_EXECUTED is False
          assert q.STRATEGY_RANKING_PERFORMED is False
          assert q.LIVE_TRADING_AUTHORIZED is False

          print("REAL_HISTORICAL_QUALIFICATION_EXECUTED_IN_CI=NO")
          print("REAL_HISTORICAL_FORENSIC_EXECUTED_IN_CI=NO")
          print("CANONICAL_ECONOMICS_EXECUTED_IN_CI=NO")
          PY

name: dev045-d6r26a-p2-r10-bounded-feature-accumulator-freeze

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r10-bounded-feature-accumulator-freeze
    paths:
      - src/multimarket/dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.py
      - tests/test_dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.py
      - docs/dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.md
      - .github/workflows/dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.py
      - tests/test_dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.py
      - docs/dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.md
      - .github/workflows/dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r10-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install narrow R10 surface
        run: |
          python -m pip install -U pip pytest numpy
          python -m pip install -e . --no-deps
      - name: Prove simulator absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("hftbacktest") is None
          print("HFTBACKTEST_INSTALLED=NO")
          print("HISTORICAL_SOURCE_OPEN=NO")
          PY
      - name: Run R10 bounded-feature equivalence tests
        run: |
          python -m pytest -q tests/test_dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze.py
      - name: Prove execution remains sealed
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r10_bounded_feature_accumulator_freeze as r10
          r10.validate_r10_contract()
          assert r10.BOUNDED_ROLLING_FEATURE_ACCUMULATOR_FROZEN is True
          assert r10.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r10.SIMULATOR_IMPORT_AUTHORIZED is False
          assert r10.CANDIDATE_SIMULATION_AUTHORIZED is False
          assert r10.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r10.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r10.MODEL_FIT_AUTHORIZED is False
          assert r10.PNL_AUTHORIZED is False
          print("BOUNDED_ROLLING_FEATURE_ACCUMULATOR_FROZEN=YES")
          print("MAX_FEATURE_WINDOW_NS=30000000000")
          print("HISTORICAL_SOURCE_OPEN=NO")
          print("SIMULATOR_IMPORT=NO")
          print("CANDIDATE_SIMULATION_STARTED=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

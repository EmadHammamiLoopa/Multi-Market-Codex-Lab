name: dev045-d6r26a-p2-r17-feed-bound-shared-feature-cache-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r17-feed-bound-shared-feature-cache-preexecution
    paths:
      - src/multimarket/dev045_d6r26a_p2_r17_feed_bound_shared_feature_cache_preexecution.py
      - tests/test_dev045_d6r26a_p2_r17_feed_bound_shared_feature_cache_preexecution.py
      - docs/dev045_d6r26a_p2_r17_feed_bound_shared_feature_cache_preexecution.md
      - .github/workflows/dev045_d6r26a_p2_r17_feed_bound_shared_feature_cache_preexecution.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r17:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install narrow test surface
        run: |
          python -m pip install -U pip
          python -m pip install pytest numpy pyarrow==25.0.1
          python -m pip install -e . --no-deps

      - name: Run R17 feed-bound/cache tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p2_r17_feed_bound_shared_feature_cache_preexecution.py

      - name: Prove previous-failure guards and historical seal
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r26a_p2_r17_feed_bound_shared_feature_cache_preexecution as r17,
          )

          r17.validate_r17_contract()

          assert r17.NATURAL_END_OF_DATA_IS_VALID_TERMINAL is True
          assert r17.EXPECTED_SUCCESS_TERMINAL_REASON == "NATURAL_END_OF_DATA"

          assert r17.FIXED_EVENT_TARGET is None
          assert r17.FIXED_WAKEUP_TARGET is None
          assert r17.REFERENCE_WAKEUP_COUNT_IS_STOP_CONDITION is False
          assert r17.NOMINAL_DAY_END_IS_STOP_CONDITION is False

          assert r17.RAW_FEATURE_PASSES_PER_DAY == 1
          assert r17.PER_LANE_RAW_FEATURE_RESCAN_FORBIDDEN is True
          assert r17.FEATURE_CACHE_SHARED_ACROSS_ALL_40_LANES is True
          assert r17.DENSE_NUMPY_CACHE_REQUIRED is True

          assert r17.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r17.CANDIDATE_SIMULATION_AUTHORIZED is False
          assert r17.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r17.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r17.MODEL_FIT_AUTHORIZED is False
          assert r17.PNL_AUTHORIZED is False

          print("R17_FEED_BOUND_SCHEDULER=PASS")
          print("SUCCESS_TERMINAL=NATURAL_END_OF_DATA")
          print("DECISION_BOUND=LAST_OBSERVED_LOCAL_FEED_TIMESTAMP")
          print("FIXED_EVENT_TARGET=NONE")
          print("FIXED_WAKEUP_TARGET=NONE")
          print("RAW_FEATURE_PASSES_PER_DAY=1")
          print("PER_LANE_RAW_FEATURE_RESCAN=FORBIDDEN")
          print("FEATURE_CACHE_SHARED_ACROSS_40_LANES=YES")
          print("FEATURE_CACHE_MAX_BYTES=268435456")
          print("HISTORICAL_SOURCE_OPEN=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

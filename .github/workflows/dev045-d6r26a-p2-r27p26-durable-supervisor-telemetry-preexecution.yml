name: dev045-d6r26a-p2-r27p26-durable-supervisor-telemetry-preexecution

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p26-durable-supervisor-telemetry-preexecution

jobs:
  r27p26-durable-supervisor-telemetry-preexecution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install narrow preexecution surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy numba pytest
          python -m pip install -e . --no-deps
      - name: Run R27P26 preexecution tests only
        run: |
          pytest -q tests/test_dev045_d6r26a_p2_r27p26_durable_supervisor_telemetry_preexecution.py
      - name: Prove CI cannot open real execution surfaces
        run: |
          python - <<'PY'
          import os
          from multimarket import dev045_d6r26a_p2_r27p26_durable_supervisor_telemetry_preexecution as r
          assert os.environ.get(r.AUTH_ENV) != r.AUTH_TOKEN
          assert r._authorized({}) is False
          assert r._worker_authorized({}) is False
          assert r.SIMULATOR_LANE_AUTHORIZED is False
          assert r.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r.P2_ATTEMPT_CONSUMED is False
          print('R27P26_CI_REAL_EXECUTION_CLOSURE=PASS')
          PY

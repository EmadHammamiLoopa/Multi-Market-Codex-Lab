name: dev045-d6r26a-p1-synthetic-candidate-labeler

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p1-synthetic-candidate-labeler
    paths:
      - src/multimarket/dev045_d6r26a_p1_synthetic_candidate_labeler.py
      - tests/test_dev045_d6r26a_p1_synthetic_candidate_labeler.py
      - docs/dev045_d6r26a_p1_synthetic_candidate_labeler.md
      - .github/workflows/dev045_d6r26a_p1_synthetic_candidate_labeler.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r26a_p1_synthetic_candidate_labeler.py
      - tests/test_dev045_d6r26a_p1_synthetic_candidate_labeler.py
      - docs/dev045_d6r26a_p1_synthetic_candidate_labeler.md
      - .github/workflows/dev045_d6r26a_p1_synthetic_candidate_labeler.yml

concurrency:
  group: d6r26a-p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p1-synthetic-labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base test tools
        run: python -m pip install -U pip pytest

      - name: Restore exact patched hftbacktest wheel
        id: hft-wheel-cache
        uses: actions/cache@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install maturin on wheel cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: python -m pip install maturin

      - name: Checkout exact upstream hftbacktest 2.4.4 source on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nkaz001/hftbacktest.git /tmp/hftbacktest
          git -C /tmp/hftbacktest checkout --detach a244a14250b42d97fc305569c93c4117cd5e1dff
          test "$(git -C /tmp/hftbacktest rev-parse HEAD)" = "a244a14250b42d97fc305569c93c4117cd5e1dff"

      - name: Apply frozen safe patch on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: python tools/patch_hftbacktest_244_safe.py /tmp/hftbacktest

      - name: Build exact patched wheel on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/dev045-hft244-wheel
          python -m pip wheel --no-deps \
            --wheel-dir /tmp/dev045-hft244-wheel \
            /tmp/hftbacktest/py-hftbacktest
          test "$(find /tmp/dev045-hft244-wheel -maxdepth 1 -type f -name 'hftbacktest-2.4.4-*.whl' | wc -l)" = "1"

      - name: Install exact patched simulator wheel
        run: |
          WHEEL="$(find /tmp/dev045-hft244-wheel -maxdepth 1 -type f -name 'hftbacktest-2.4.4-*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install "$WHEEL"

      - name: Install project
        run: python -m pip install -e .

      - name: Verify simulator, GTX, and order-status identities
        run: |
          python - <<'PY'
          import importlib.metadata as m
          from hftbacktest.order import (
              GTX,
              NONE,
              NEW,
              EXPIRED,
              FILLED,
              CANCELED,
              PARTIALLY_FILLED,
              REJECTED,
          )
          from multimarket import dev045_d6r26a_p1_synthetic_candidate_labeler as p

          assert m.version("hftbacktest") == "2.4.4"
          assert int(GTX) == 1
          assert int(NONE) == p.HFT_NONE == 0
          assert int(NEW) == p.HFT_NEW == 1
          assert int(EXPIRED) == p.HFT_EXPIRED == 2
          assert int(FILLED) == p.HFT_FILLED == 3
          assert int(CANCELED) == p.HFT_CANCELED == 4
          assert int(PARTIALLY_FILLED) == p.HFT_PARTIALLY_FILLED == 5
          assert int(REJECTED) == p.HFT_REJECTED == 6
          print("HFTBACKTEST_VERSION=2.4.4")
          print("GTX_POST_ONLY_IDENTITY=PASS")
          print("ORDER_STATUS_IDENTITY=PASS")
          PY

      - name: Run P1 label contract and existing real-engine execution probes
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p1_synthetic_candidate_labeler.py \
            tests/test_dev045_m4_adapter.py

      - name: Prove P1 remains synthetic-only
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p1_synthetic_candidate_labeler as p
          p.validate_p1_contract()
          assert p.SYNTHETIC_ONLY is True
          assert p.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert p.CANONICAL_LABEL_MATERIALIZATION_AUTHORIZED is False
          assert p.MODEL_FIT_AUTHORIZED is False
          assert p.PNL_AUTHORIZED is False
          assert p.ECONOMIC_ARENA_AUTHORIZED is False
          print("D6R26A_P1_SYNTHETIC_ONLY=YES")
          print("HISTORICAL_SOURCE_OPENED=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

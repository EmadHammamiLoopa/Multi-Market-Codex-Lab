name: dev045-d6r26a-p2-r11-synthetic-real-engine-lane-lifecycle

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r11-synthetic-real-engine-lane-lifecycle
    paths:
      - src/multimarket/dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.py
      - tests/test_dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.py
      - docs/dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.md
      - .github/workflows/dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.py
      - tests/test_dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.py
      - docs/dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.md
      - .github/workflows/dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.yml
  workflow_dispatch:

concurrency:
  group: d6r26a-p2-r11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-r11-real-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install narrow test surface
        run: python -m pip install -U pip pytest numpy

      - name: Restore exact patched hftbacktest wheel
        id: hft-wheel-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install maturin on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: python -m pip install maturin

      - name: Build exact patched simulator wheel on cache miss
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nkaz001/hftbacktest.git /tmp/hftbacktest
          git -C /tmp/hftbacktest checkout --detach a244a14250b42d97fc305569c93c4117cd5e1dff
          test "$(git -C /tmp/hftbacktest rev-parse HEAD)" = "a244a14250b42d97fc305569c93c4117cd5e1dff"
          python tools/patch_hftbacktest_244_safe.py /tmp/hftbacktest
          mkdir -p /tmp/dev045-hft244-wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/dev045-hft244-wheel /tmp/hftbacktest/py-hftbacktest
          test "$(find /tmp/dev045-hft244-wheel -maxdepth 1 -type f -name 'hftbacktest-2.4.4-*.whl' | wc -l)" = "1"

      - name: Save exact patched wheel immediately after build
        if: steps.hft-wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/dev045-hft244-wheel
          key: dev045-hft244-wheel-${{ runner.os }}-py313-a244a14250b42d97fc305569c93c4117cd5e1dff-${{ hashFiles('tools/patch_hftbacktest_244_safe.py') }}

      - name: Install exact patched simulator and project
        run: |
          WHEEL="$(find /tmp/dev045-hft244-wheel -maxdepth 1 -type f -name 'hftbacktest-2.4.4-*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install "$WHEEL"
          python -m pip install -e . --no-deps

      - name: Verify exact engine identity
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r5_real_engine_binding_prehistorical as r5
          x = r5.verify_engine_identity()
          assert x.version == "2.4.4"
          print("HFTBACKTEST_244_IDENTITY=PASS")
          PY

      - name: Run R11 real-engine lifecycle probes
        run: |
          python -m pytest -q tests/test_dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle.py

      - name: Prove historical execution remains sealed
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r11_synthetic_real_engine_lane_lifecycle as r11
          r11.validate_r11_contract()
          assert r11.SYNTHETIC_REAL_ENGINE_ONLY is True
          assert r11.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert r11.CANONICAL_HISTORICAL_RUN_AUTHORIZED is False
          assert r11.ATTEMPT_MARKER_WRITE_AUTHORIZED is False
          assert r11.CANONICAL_LABEL_WRITE_AUTHORIZED is False
          assert r11.MODEL_FIT_AUTHORIZED is False
          assert r11.PNL_AUTHORIZED is False
          print("R11_SYNTHETIC_REAL_ENGINE=PASS")
          print("HISTORICAL_SOURCE_OPEN=NO")
          print("CANDIDATE_HISTORICAL_SIMULATION=NO")
          print("ATTEMPT_MARKER_WRITTEN=NO")
          print("P2_ATTEMPT_CONSUMED=NO")
          print("CANONICAL_LABEL_WRITE=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY

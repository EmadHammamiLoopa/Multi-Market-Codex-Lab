name: dev045-d6r16-mar-jul-successor-stack

on:
  push:
    branches:
      - research/dev045-m6-d6r16-mar-jul-full-day-sequence
  pull_request:
    paths:
      - src/multimarket/dev045_d6r16_mar_jul_contract.py
      - src/multimarket/dev045_d6r16_mar_jul_execution.py
      - tests/test_dev045_d6r16_mar_jul.py
      - evidence/dev045_d6r16_mar_jul_sequence_design.json
      - evidence/dev045_d6r16_d6r9b_lineage_witness_amendment.json
      - evidence/dev045_d6r16_mar_jul_successor_stack.json
      - .github/workflows/dev045_d6r16_mar_jul_successor_stack.yml

jobs:
  dev045-d6r16-mar-jul-successor-stack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install exact test runtime
        run: |
          python -m pip install -e . pytest "hftbacktest==2.4.4"

      - name: Run D6R16 synthetic suite
        run: |
          python -m pytest -q tests/test_dev045_d6r16_mar_jul.py

      - name: Child resolution smoke
        run: |
          python -m multimarket.dev045_d6r16_mar_jul_execution \
            --child-resolution-smoke

      - name: Prove CI cannot execute canonical sequence
        run: |
          python - <<'PY'
          import os

          from multimarket import dev045_d6r16_mar_jul_contract as c

          assert c.AUTHORIZATION_ENV not in os.environ
          assert c.FEB01_RERUN_FORBIDDEN is True
          assert c.D6R15_RERUN_FORBIDDEN is True
          assert c.FIXED_WAKEUP_STOP_TARGET is None
          assert c.TOTAL_RSS_ABORT_THRESHOLD_BYTES is None
          assert c.AUTOMATIC_RETRY is False
          assert c.STOP_ON_FIRST_NONPASS is True

          print("AUTHORIZATION_TOKEN_PRESENT=NO")
          print("CANONICAL_EXECUTION=NO")
          print("FEB_RERUN=NO")
          PY

name: dev045-d6r19-canonical-runner

on:
  push:
    branches:
      - research/dev045-m6-d6r19-response-batch-coherent-replacement
  pull_request:
    paths:
      - src/multimarket/dev045_d6r19_canonical_runner.py
      - tests/test_dev045_d6r19_canonical_runner.py
      - tests/test_dev045_d6r19_response_batch_replacement_driver.py
      - tests/test_dev045_d6r18_canonical_runner.py
      - .github/workflows/dev045_d6r19_canonical_runner.yml

jobs:
  synthetic-canonical-runner-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install unit-test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest

      - name: Run synthetic and unit contracts only
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r19_response_batch_replacement_driver.py \
            tests/test_dev045_d6r19_canonical_runner.py \
            tests/test_dev045_d6r18_canonical_runner.py

      - name: Verify execution remains closed
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r19_canonical_runner as runner

          assert runner.CANONICAL_EXECUTION_AUTHORIZED_BY_DEFAULT is False
          assert runner.CANONICAL_ATTEMPT_CONSUMED is False
          assert runner.AUTOMATIC_RETRY is False
          assert runner.LIVE_TRADING_AUTHORIZED is False
          assert runner.FRESH_REPLACEMENT_SEMANTICS is True
          assert runner.RESPONSE_BATCH_COHERENT_REPLACEMENT is True

          print("CANONICAL_DATA_OPENED_IN_CI=NO")
          print("CANONICAL_SOURCE_HASHED_IN_CI=NO")
          print("HISTORICAL_ECONOMICS_IN_CI=NO")
          print("D6R19_ATTEMPT_CONSUMED_IN_CI=NO")
          PY

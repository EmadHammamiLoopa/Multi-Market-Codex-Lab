name: dev045-d6r26a-p2-r27p9-cpython313-float-sum-parity-amendment

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-r27p9-cpython313-float-sum-parity-amendment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r27p9-cpython313-float-sum-parity-amendment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install narrow synthetic test surface
        run: |
          python -m pip install -U pip
          python -m pip install pytest numpy==2.2.6 pyarrow==25.0.1 numba==0.67.0 llvmlite==0.49.0
          python -m pip install -e . --no-deps

      - name: Run R27P9 arithmetic parity tests
        run: |
          python -m pytest -q tests/test_dev045_d6r26a_p2_r27p9_cpython313_float_sum_parity_amendment.py

      - name: Prove R27P9 opens no historical execution surface
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_r27p9_cpython313_float_sum_parity_amendment as r

          r.validate_r27p9_contract()
          assert r.CPYTHON_REFERENCE_VERSION == '3.13'
          assert r.CPYTHON_FLOAT_SUM_ALGORITHM == 'NEUMAIER_COMPENSATED_SUM'
          assert r.AMENDED_FEATURE_NAME == 'l5_obi'
          assert r.AMENDED_FEATURE_INDEX == 5
          assert r.AMENDED_FEATURE_COUNT == 1
          assert r.REAL_HISTORICAL_BENCHMARK_AUTHORIZED is False
          assert r.REAL_HISTORICAL_DIAGNOSTIC_AUTHORIZED is False
          assert r.FULL_JAN_JUL_RERUN_AUTHORIZED is False
          assert r.DURABLE_CONTEXT_WRITE_AUTHORIZED is False
          assert r.P2_ATTEMPT_CONSUMED is False
          assert r.SIMULATOR_LANE_AUTHORIZED is False
          assert r.MODEL_FIT_AUTHORIZED is False
          assert r.PNL_AUTHORIZED is False
          print('R27P9_CONTRACT=PASS')
          print('REAL_HISTORICAL_SOURCE_OPENED_IN_CI=NO')
          print('P2_ATTEMPT_CONSUMED=NO')
          print('FULL_JAN_JUL_RERUN=NO')
          print('SIMULATOR_RUN=NO')
          print('MODEL_FIT=NO')
          print('PNL=NO')
          PY

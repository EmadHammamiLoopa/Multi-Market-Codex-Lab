name: dev045-d6r17-direct-action-driver-bridge

on:
  push:
    branches:
      - research/dev045-m6-d6r17-post-ingestion-advancement-design
  workflow_dispatch:

jobs:
  dev045-d6r17-direct-action-driver-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest

      - name: Run bridge contract tests
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r17_direct_action_driver_bridge.py \
            tests/test_dev045_d6r17_direct_action_support.py

      - name: Verify canonical surfaces remain closed
        run: |
          python - <<'PY'
          from multimarket import (
              dev045_d6r17_direct_action_driver_bridge as b,
          )

          assert b.CANONICAL_SOURCE_OPEN_IMPLEMENTED is False
          assert b.CANONICAL_EXECUTION_AUTHORIZED_BY_DEFAULT is False
          assert b.AUTOMATIC_RETRY is False
          assert b.CANONICAL_PNL_WRITE_ENABLED is False
          assert b.NETWORK_ACQUISITION_ENABLED is False
          assert b.LIVE_TRADING_AUTHORIZED is False

          print("CANONICAL_SOURCE_OPEN=NO")
          print("CANONICAL_EXECUTION=NO")
          print("HISTORICAL_PNL=NO")
          PY

name: dev045-d6r26a-p2-jan-jul-consumed-development-label-design

on:
  push:
    branches:
      - research/dev045-m6-d6r26a-p2-jan-jul-consumed-development-label-design
    paths:
      - src/multimarket/dev045_d6r26a_p2_jan_jul_consumed_development_label_design.py
      - tests/test_dev045_d6r26a_p2_jan_jul_consumed_development_label_design.py
      - docs/dev045_d6r26a_p2_jan_jul_consumed_development_label_design.md
      - .github/workflows/dev045_d6r26a_p2_jan_jul_consumed_development_label_design.yml
  pull_request:
    paths:
      - src/multimarket/dev045_d6r26a_p2_jan_jul_consumed_development_label_design.py
      - tests/test_dev045_d6r26a_p2_jan_jul_consumed_development_label_design.py
      - docs/dev045_d6r26a_p2_jan_jul_consumed_development_label_design.md
      - .github/workflows/dev045_d6r26a_p2_jan_jul_consumed_development_label_design.yml

concurrency:
  group: d6r26a-p2-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d6r26a-p2-design-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project without runtime dependencies and pytest
        run: |
          python -m pip install -U pip pytest
          python -m pip install -e . --no-deps
      - name: Prove hftbacktest is not installed for design-only CI
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("hftbacktest") is None
          print("HFTBACKTEST_INSTALLED=NO")
          print("ENGINE_BUILD=SKIPPED_DESIGN_ONLY")
          PY
      - name: Run P0/P1/P2 design contracts
        run: |
          python -m pytest -q \
            tests/test_dev045_d6r26a_p0_formal_gen2_conditional_maker_edge_design.py \
            tests/test_dev045_d6r26a_p1_synthetic_candidate_labeler.py \
            tests/test_dev045_d6r26a_p2_jan_jul_consumed_development_label_design.py
      - name: Prove P2 remains design-only and final bucket sealed
        run: |
          python - <<'PY'
          from multimarket import dev045_d6r26a_p2_jan_jul_consumed_development_label_design as p
          p.validate_design_contract()
          assert p.DATA_ROLE == "CONSUMED_DEVELOPMENT"
          assert p.APR_JUL_ROLE == "CONSUMED_DEVELOPMENT"
          assert p.FINAL_REAL_BUCKET_OPEN_AUTHORIZED is False
          assert p.HISTORICAL_SOURCE_OPEN_AUTHORIZED is False
          assert p.CANDIDATE_SIMULATION_AUTHORIZED is False
          assert p.MODEL_FIT_AUTHORIZED is False
          assert p.PNL_AUTHORIZED is False
          assert p.AUG_OPEN_AUTHORIZED is False
          assert p.SEP_PLUS_OPEN_AUTHORIZED is False
          print("D6R26A_P2_DESIGN_ONLY=YES")
          print("JAN_JUL_DATA_ROLE=CONSUMED_DEVELOPMENT")
          print("FINAL_REAL_BUCKET=SEALED")
          print("HISTORICAL_SOURCE_OPENED=NO")
          print("CANDIDATE_SIMULATION=NO")
          print("MODEL_FIT=NO")
          print("PNL=NO")
          PY
